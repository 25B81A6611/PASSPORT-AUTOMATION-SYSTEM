<!DOCTYPE html>
<html>
<head>
    <title>Passport Automation System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f4; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #1e3a8a; }
        h2 { color: #3b82f6; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="date"], input[type="email"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #1e3a8a; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #3b82f6; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h1>🛂 Passport Automation Portal</h1>

    <!-- 1. Application Form -->
    <div class="section">
        <h2>1. New Passport Application</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Date of Birth:</label>
                <input type="date" required>
            </div>
            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" placeholder="name@email.com" required>
            </div>
            <div class="form-group">
                <label>Application Type:</label>
                <select>
                    <option>Fresh Passport</option>
                    <option>Passport Re-issue / Renewal</option>
                </select>
            </div>
            <button type="submit" onclick="alert('Application Sent Successfully!')">Submit Application</button>
        </form>
    </div>

    <!-- 2. Track Status Form -->
    <div class="section">
        <h2>2. Track Application Status</h2>
        <div class="form-group">
            <label>Enter Reference Number:</label>
            <input type="text" placeholder="e.g., PAS-12345">
        </div>
        <button type="button" onclick="alert('Status: Document Verification in Progress')">Check Status</button>
    </div>

    <!-- 3. Admin View -->
    <div class="section">
        <h2>3. Admin Dashboard (Pending Approvals)</h2>
        <table>
            <tr>
                <th>App ID</th>
                <th>Applicant Name</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            <tr>
                <td>PAS-9871</td>
                <td>Rahul Sharma</td>
                <td>Pending Verification</td>
                <td><button type="button" onclick="alert('Approved')">Approve</button></td>
            </tr>
            <tr>
                <td>PAS-9872</td>
                <td>Priya Patel</td>
                <td>Documents Uploaded</td>
                <td><button type="button" onclick="alert('Approved')">Approve</button></td>
            </tr>
        </table>
    </div>

</body>
</html>
